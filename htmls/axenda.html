    <script>

      // Responsiveness for smartphones
      if (screen.width < 500) {
        initial_zoom = 6;  // the smaller the smartphone, the smaller the initial zoom

        initial_zoom = 7;
        button_group = 0;  // big screens use the un-collapsed buttons to filter dates
      } else {
        initial_zoom = 8;
        button_group = 0;
      }

      // Disable map rotation
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();

      // Add fullscreen button
      map.addControl(new maplibregl.FullscreenControl());

          attribControl.classList.remove('maplibregl-compact-show');
          const attribInner = attribControl.querySelector('.maplibregl-ctrl-attrib-inner');

            attribInner.innerHTML = attribInner.innerHTML.replace(/<br>\s*\|\s*/gi, '<br>');
          }

        // 2. Hide water/sea/ocean labels

        // 4. Soften place text color from black to dark grey
        for (const layer of map.getStyle().layers) {
          // Hide vegetation background
          if (
            layer.id === 'landcover_wood' ||
            layer.id === 'park' ||
            layer['source-layer'] === 'park' ||
            (layer['source-layer'] === 'landcover' && layer.id.startsWith('landcover_wood'))
          ) {
            map.setLayoutProperty(layer.id, 'visibility', 'none');
            continue;
          }

          if (layer.type === 'symbol') {
            if (
              layer['source-layer'] === 'water_name' ||
              layer['source-layer'] === 'waterway' ||
              layer.id.startsWith('water') ||
              layer.id === 'label_state'
            ) {
              map.setLayoutProperty(layer.id, 'visibility', 'none');
              continue;
            }

            }

            }
