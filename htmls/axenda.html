<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GZmusica map</title>

    <meta name="description" content="A map of scheduled events from GZmusica (Galician folk music gigs).">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="robots" content="index, follow" />
    <meta name="og:title" property="og:title" content="GZmusica map">

    <!-- Emoji as Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <!-- Bootstrap scripts -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <!-- FontAwesome-->
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.0/css/all.css" integrity="sha384-73lvm+n3qtrHBHjfLuMY7kIL3CdwrRc5jqCtzWASs6MshmR6Tq2veVBC5OVkSwEF" crossorigin="anonymous">

    <!-- Mapbox-->
    <script src='https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.css' rel='stylesheet' />

    <style>
      @import url("https://fonts.googleapis.com/css?family=Raleway:400,300,700,500");

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      #menu {
        font-family: "Raleway", sans-serif !important;
      }

      /* Marker tweaks */
      .maplibregl-popup-close-button {
        display: none;
      }

      .maplibregl-popup-content h4 {
        font: 600 15px/22px 'Source Sans Pro', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        margin-bottom: -15px;
      }

      /* Bootstrap button */
      .btn.btn-dark:focus {
        background-color: #85001c
      }

      @media (max-width: 500px) {
        .HideOnMobile {
          display: none;
        }
        .ShowOnMobile {
          display: initial;
        }
      }

      @media (min-width: 500px) {
        .HideOnMobile {
          display: initial;
        }
        .ShowOnMobile {
          display: none;
        }
      }

    </style>

  </head>
  <body>

    <div id="map"></div>

    <div id="menu">
      <div class="col text-center">

        <!-- On big screens we show un-collapsed buttons -->
        <div class="HideOnMobile">
          <button class="btn btn-dark mt-1 mb-1 filter-today">Hoxe</button>
          <button class="btn btn-dark mt-1 mb-1 filter-tomorrow">Mañá</button>
          <button class="btn btn-dark mt-1 mb-1 filter-week">Próximos 7 días</button>
          <button class="btn btn-dark mt-1 mb-1 filter-month" autofocus="autofocus">Próximos 30 días</button>
        </div>

        <!-- On small screens we show buttons collapsed in a single dropdown -->
        <div class="ShowOnMobile">
          <div class="dropdown">
            <button class="btn btn-dark mt-1 mb-1 dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Data
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
              <a class="dropdown-item filter-today">Hoxe</a>
              <a class="dropdown-item filter-tomorrow">Mañá</a>
              <a class="dropdown-item filter-week">Próximos 7 días</a>
              <a class="dropdown-item filter-month">Próximos 30 días</a>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>

      // Responsiveness for smartphones
      if (screen.width < 500) {
        initial_zoom = 6;  // the smaller the smartphone, the smaller the initial zoom
        button_group = 1;  // small screens use the dropdown to filter dates
      } else if (screen.width < 1000) {
        initial_zoom = 7;
        button_group = 0;  // big screens use the un-collapsed buttons to filter dates
      } else {
        initial_zoom = 8;
        button_group = 0;
      }

      // Define the map style (OpenStreetMap raster tiles)
      const style = {
        "version": 8,
        "glyphs": "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf", // issue --> https://github.com/mapbox/mapbox-gl-js/issues/4808
        "sources": {
          "osm": {
            "type": "raster",
            "tiles": [
              // 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'
              // 'https://stamen-tiles.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.jpg'
              'https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png'
              // 'http://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
              // 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              // 'https://stamen-tiles-b.a.ssl.fastly.net/toner/{z}/{x}/{y}.png'
            ],
            "tileSize": 256,
            "attribution": "&copy; <a href='https://carto.com'>Carto</a> and <a href='https://www.openstreetmap.org'>OpenStreetMap</a> Contributors <br> &#127757; Map created by <a href='https://ignacioheredia.github.io'>Ignacio Heredia</a> <br> &#128204; <span class='badge badge-secondary'>Locations are approximate</span>",
            "maxzoom": 19
          }
        },
        "layers": [{
          "id": "osm",
          "type": "raster",
          "source": "osm" // This must match the source key above
        }]
      };

      const map = new maplibregl.Map({
        container: "map",
        // style: "mapbox://styles/mapbox/dark-v10",
        // style: 'https://demotiles.maplibre.org/style.json',
        // style: 'https://api.maptiler.com/maps/streets/style.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL',
        // style: 'https://openmaptiles.github.io/positron-gl-style/style-cdn.json',
        style: style,
        center: [-8.0, 42.756501],
        zoom: initial_zoom
      });

      // Disable map rotation
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();

      // Avoid fractional zoom that makes maps blurry
      // related issue: https://github.com/mapbox/mapbox-gl-js/issues/1695#issuecomment-478392580
      // --> suggested answer works but zooms on center of map, not on mouse pointer; therefore poor UX
      // better setWheelZoomRate(1) and disable touch zoom
      map.addControl(new maplibregl.NavigationControl());
      map.scrollZoom.setWheelZoomRate(1);
      map.touchZoomRotate.disable();

      // Add fullscreen button
      map.addControl(new maplibregl.FullscreenControl());

      map.on("load", () => {
        map.addSource("earthquakes", {
            type: "geojson",

'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.157774953736114', '43.501449975017294']}, 'properties': {'name': 'Lontras', 'location': 'Neda', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30899/-/lontras.html', 'dates': 'Xoves 27 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.412744346599756', '42.7789109494709']}, 'properties': {'name': 'A Noite Meiga', 'location': 'Sarria', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30684/-/a-noite-meiga.html', 'dates': 'Venres 28, Sábado 29 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.125531034071434', '43.00825648678251']}, 'properties': {'name': 'Festival da Luz', 'location': 'Boimorto', 'link': 'https://www.gzmusica.com/axenda/eventdetail/29766/-/festival-da-luz.html', 'dates': 'Venres 28, Sábado 29, Domingo 30 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.826337690901576', '42.562585025732396']}, 'properties': {'name': 'VilaBlues', 'location': 'Vilanova de Arousa', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30956/-/vilablues.html', 'dates': 'Venres 28, Sábado 29 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-9.216891844248476', '43.107376535960995']}, 'properties': {'name': 'Mascada + Basic Partner', 'location': 'Muxía', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31008/-/mascada-basic-partner.html', 'dates': 'Venres 28 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.79271314219974', '42.087959380801024']}, 'properties': {'name': 'Roger & Bernard', 'location': 'Vilar de Santos', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30922/-/roger-bernard.html', 'dates': 'Venres 28, Sábado 29 [Agosto]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.792759542472353', '42.089103472230626']}, 'properties': {'name': 'Roger de Flor e Bernard Taylor', 'location': 'Vilar de S 'geometry': {'type': 'Point', 'coordinates': ['-7.358207512996472', '43.66233457987946']}, 'properties': {'name': 'Festival Osa do Mar', 'location': 'Burela', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30225/-/festival-osa-do-mar.html', 'dates': 'Xoves 03, Venres 04, Sábado 05, Domingo 06 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.39571979769279', '43.3727042635902']}, 'properties': {'name': '10º Flores Rock', 'location': 'A Coruña', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30983/-/10-flores-rock.html', 'dates': 'Venres 04, Sábado 05, Domingo 06 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.836948416450386', '43.16383566030146']}, 'properties': {'name': 'IX Parga Rock', 'location': 'Parga (Guitiriz)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30966/-/ix-parga-rock.html', 'dates': 'Venres 04, Sábado 05 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.497041930486906', '42.084090754463965']}, 'properties': {'name': 'XXXVIII Festival da Poesía do Condado', 'location': 'Salvaterra de Miño', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30763/-/xxxviii-festival-da-poesia-do-condado.html', 'dates': 'Venres 04, Sábado 05 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.379718294077632', '42.09203408987001']}, 'properties': {'name': 'Festas de Vide', 'location': 'Vide (As Neves)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30967/-/festas-de-vide.html', 'dates': 'Venres 04 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.757154656879171', '42.613863547360715']}, 'properties': {'name': 'Ameixa Rock', 'location': 'O Carril (Vilagarcía Arousa)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30984/-/ameixa-rock.html', 'dates': 'Sábado 05, Domingo 06 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-9.087853256821527', '42.91452639140399']}, 'properties': {'name': 'IV Encontro Burla Verde', 'location': 'Arcos (Mazaricos)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30860/-/iv-encontro-burla-verde.html', 'dates': 'Sábado 05, Domingo 06 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.096192078519994', '43.42792555822815']}, 'properties': {'name': 'XVII A Fía da Lá', 'location': 'Soaserra (Cabanas)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30979/-/xvii-a-fia-da-la.html', 'dates': 'Sábado 05 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.80864145204553', '43.32575015178404']}, 'properties': {'name': 'Brais Morán', 'location': 'Malpica de Bergantiños', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30732/-/brais-moran.html', 'dates': 'Sábado 05 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.661982143586645', '42.2056932433444']}, 'properties': {'name': 'XLII Festa do Monte', 'location': 'Rebullón, Tameiga (Mos)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31004/-/xlii-festa-do-monte.html', 'dates': 'Domingo 06 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.785469744671733', '42.58929292373392']}, 'properties': {'name': 'Revenidas', 'location': 'Vilaxoán, Sobrán (Vilagarcía de Arousa)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/29569/-/revenidas.html', 'dates': 'Xoves 10, Venres 11, Sábado 12, Domingo 13 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.816097902954125', '42.65061043883648']}, 'properties': {'name': 'Festas da Guadalupe', 'location': 'Rianxo', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30975/-/festas-da-guadalupe.html', 'dates': 'Venres 11, Sábado 12, Domingo 13, Luns 14, Martes 15, Mércores 16, Xoves 17, Venres 18 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.723394407633664', '42.23769833268491']}, 'properties': {'name': 'IV Festival Vigo Metalheads', 'location': 'Vigo', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30285/-/iv-festival-vigo-metalheads.html', 'dates': 'Venres 11, Sábado 12 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.436305877187221', '42.70353383765954']}, 'properties': {'name': 'XXV Folk de Raíz', 'location': 'Callobre (A Estrada)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30785/-/xxv-folk-de-raiz.html', 'dates': 'Venres 11 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.258327583956898', '42.77063838464604']}, 'properties': {'name': 'Foliada Eferro', 'location': 'Merza (Vila de Cruces)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30842/-/foliada-eferro.html', 'dates': 'Sábado 12 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.641238749137978', '42.433350297272185']}, 'properties': {'name': 'Somos Música', 'location': 'Pontevedra', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30576/-/somos-musica.html', 'dates': 'Venres 18, Sábado 19, Domingo 20, Luns 21, Martes 22, Mércores 23 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.139015732005955', '43.551364199340746']}, 'properties': {'name': 'IV Foliada de Sedes', 'location': 'Sedes (Narón)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30981/-/iv-foliada-de-sedes.html', 'dates': 'Sábado 19 [Setembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.017876793840584', '42.76260407517124']}, 'properties': {'name': 'Valentín Caamaño Quartet', 'location': 'Agolada, Ferreiroa (Agolada)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30672/-/valentin-caamano-quartet.html', 'dates': 'Sábado 19 [Setembro]'}}]},
            // data: "https://docs.mapbox.com/mapbox-gl-js/assets/earthquakes.geojson",
            cluster: !0,
            clusterMaxZoom: 14,
            clusterRadius: 50
          }), map.addLayer({
            id: "clusters",
            type: "circle",
            source: "earthquakes",
            filter: ["has", "point_count"],
            paint: {
              "circle-color": ["step", ["get", "point_count"], "#51bbd6", 10, "#ed9f32", 20, "#f28cb1"],
              "circle-radius": ["step", ["get", "point_count"], 20, 100, 30, 750, 40]
            }
          }), map.addLayer({
            id: "cluster-count",
            type: "symbol",
            source: "earthquakes",
            filter: ["has", "point_count"],
            layout: {
              "text-field": "{point_count_abbreviated}",
              // "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Bold"],
              "text-font": ["Open Sans Bold"],
              "text-size": 12
            }
          }), map.addLayer({
            id: "unclustered-point",
            type: "circle",
            source: "earthquakes",
            filter: ["!", ["has", "point_count"]],
            paint: {
              "circle-color": "#11b4da",
              "circle-radius": 7,
              "circle-stroke-width": 2,
              "circle-stroke-color": "#0b5975"
            }
          }), map.on("click", "clusters", e => {
            const t = map.queryRenderedFeatures(e.point, {
                layers: ["clusters"]
              }),
              a = t[0].properties.cluster_id;
            map.getSource("earthquakes").getClusterExpansionZoom(a, (e, a) => {
              e || map.easeTo({
                center: t[0].geometry.coordinates,
                zoom: a
              })
            })
          }), map.on("click", "unclustered-point", e => {
            const t = e.features[0].geometry.coordinates.slice(),
              name = e.features[0].properties.name,
              location = e.features[0].properties.location,
              link = e.features[0].properties.link,
              dates = e.features[0].properties.dates;
            for (; Math.abs(e.lngLat.lng - t[0]) > 180;) t[0] += e.lngLat.lng > t[0] ? 360 : -360;
            (new maplibregl.Popup).setLngLat(t).setHTML(`
            <h4>${name}</h4><br>
            <i class="fa fa-map-marker" aria-hidden="true"></i> ${location}<br>
            <a href="${link}" target="_blank" rel="noopener"><i class="fa fa-external-link" aria-hidden="true"></i> Detalles</a><br>
            <i class="fa fa-calendar" aria-hidden="true"></i> ${dates}
            `).addTo(map)
          }), map.on("mouseenter", "clusters", () => {
            map.getCanvas().style.cursor = "pointer"
          }), map.on("mouseleave", "clusters", () => {
            map.getCanvas().style.cursor = ""
          }),
