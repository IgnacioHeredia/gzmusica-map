<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GZmusica map</title>

    <meta name="description" content="A map of scheduled events from GZmusica (Galician folk music gigs).">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="robots" content="index, follow" />
    <meta name="og:title" property="og:title" content="GZmusica map">

    <!-- Emoji as Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <!-- Bootstrap scripts -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <!-- FontAwesome-->
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.0/css/all.css" integrity="sha384-73lvm+n3qtrHBHjfLuMY7kIL3CdwrRc5jqCtzWASs6MshmR6Tq2veVBC5OVkSwEF" crossorigin="anonymous">

    <!-- MapLibre-->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
      @import url("https://fonts.googleapis.com/css?family=Raleway:400,300,700,500");

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      #menu {
        font-family: "Raleway", sans-serif !important;
      }

      /* Marker tweaks */
      .maplibregl-popup-close-button {
        display: none;
      }

      .maplibregl-popup-content h4 {
        font: 600 15px/22px 'Source Sans Pro', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        margin-bottom: -15px;
      }

      /* Bootstrap button */
      .btn.btn-dark:focus {
        background-color: #85001c
      }

      @media (max-width: 500px) {
        .HideOnMobile {
          display: none;
        }
        .ShowOnMobile {
          display: initial;
        }
      }

      @media (min-width: 500px) {
        .HideOnMobile {
          display: initial;
        }
        .ShowOnMobile {
          display: none;
        }
      }

    </style>

  </head>
  <body>

    <div id="map"></div>

    <div id="menu">
      <div class="col text-center">

        <!-- On big screens we show un-collapsed buttons -->
        <div class="HideOnMobile">
          <button class="btn btn-dark mt-1 mb-1 filter-today">Hoxe</button>
          <button class="btn btn-dark mt-1 mb-1 filter-tomorrow">Mañá</button>
          <button class="btn btn-dark mt-1 mb-1 filter-week">Próximos 7 días</button>
          <button class="btn btn-dark mt-1 mb-1 filter-month" autofocus="autofocus">Próximos 30 días</button>
        </div>

        <!-- On small screens we show buttons collapsed in a single dropdown -->
        <div class="ShowOnMobile">
          <div class="dropdown">
            <button class="btn btn-dark mt-1 mb-1 dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Data
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
              <a class="dropdown-item filter-today">Hoxe</a>
              <a class="dropdown-item filter-tomorrow">Mañá</a>
              <a class="dropdown-item filter-week">Próximos 7 días</a>
              <a class="dropdown-item filter-month">Próximos 30 días</a>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>

      // Responsiveness for smartphones
      if (screen.width < 500) {
        initial_zoom = 6;  // the smaller the smartphone, the smaller the initial zoom
        button_group = 1;  // small screens use the dropdown to filter dates
      } else if (screen.width < 1000) {
        initial_zoom = 7;
        button_group = 0;  // big screens use the un-collapsed buttons to filter dates
      } else {
        initial_zoom = 8;
        button_group = 0;
      }

      const map = new maplibregl.Map({
        container: "map",
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [-8.0, 42.756501],
        zoom: initial_zoom,
        attributionControl: false
      });

      map.addControl(new maplibregl.AttributionControl({
        compact: true,
        customAttribution: "&#127757; Map created by <a href='https://ignacioheredia.github.io'>Ignacio Heredia</a> <br> &#128204; <span class='badge badge-secondary'>Locations are approximate</span> <br>"
      }));

      // Disable map rotation
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();

      // Add fullscreen button
      map.addControl(new maplibregl.FullscreenControl());

      map.on("load", () => {
        // Collapse attribution control by default and remove leading pipe before OpenFreeMap
        const attribControl = document.querySelector('.maplibregl-ctrl-attrib');
        if (attribControl) {
          attribControl.classList.remove('maplibregl-compact-show');
          const attribInner = attribControl.querySelector('.maplibregl-ctrl-attrib-inner');
          if (attribInner) {
            attribInner.innerHTML = attribInner.innerHTML.replace(/<br>\s*\|\s*/gi, '<br>');
          }
        }

        // Customize OpenFreeMap map layers:
        // 1. Hide vegetation/greenery background (wood landcover, parks)
        // 2. Hide water/sea/ocean labels
        // 3. Increase minzoom for minor sub-localities (parishes, hamlets, neighborhoods in label_other) and road shields so they only show when zooming in close (e.g. zoom >= 13)
        // 4. Soften place text color from black to dark grey
        for (const layer of map.getStyle().layers) {
          // Hide vegetation background
          if (
            layer.id === 'landcover_wood' ||
            layer.id === 'park' ||
            layer['source-layer'] === 'park' ||
            (layer['source-layer'] === 'landcover' && layer.id.startsWith('landcover_wood'))
          ) {
            map.setLayoutProperty(layer.id, 'visibility', 'none');
            continue;
          }

          if (layer.type === 'symbol') {
            if (
              layer['source-layer'] === 'water_name' ||
              layer['source-layer'] === 'waterway' ||
              layer.id.startsWith('water') ||
              layer.id === 'label_state'
            ) {
              map.setLayoutProperty(layer.id, 'visibility', 'none');
              continue;
            }

            // Show minor localities (label_other) and road shields only at higher zoom (>= 11)
            if (layer.id === 'label_other' || layer.id.startsWith('highway-shield') || layer.id.startsWith('road_shield')) {
              map.setLayerZoomRange(layer.id, 11, 24);
            }

            const textColor = map.getPaintProperty(layer.id, 'text-color');
            if (textColor === '#000' || textColor === '#000000' || textColor === 'black') {
              map.setPaintProperty(layer.id, 'text-color', '#555555');
            }
          }
        }

        map.addSource("folk-events", {
          // Original data: "https://docs.mapbox.com/mapbox-gl-js/assets/earthquakes.geojson",
            type: "geojson",
            data: {'type': 'FeatureCollection', 'features': [{'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.544097945081786', '42.88149467726764']}, 'properties': {'name': 'Banda das Crechas', 'location': 'Santiago de Compostela', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31308/-/banda-das-crechas.html', 'dates': 'Mércores 28 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.82002053034617', '42.60990890070857']}, 'properties': {'name': 'XXI Castañazo Rock', 'location': 'Chantada', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30220/-/xxi-castanazo-rock.html', 'dates': 'Venres 30, Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.407629550675832', '43.07789756356539']}, 'properties': {'name': 'Pakolas', 'location': 'Ordes', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31298/-/pakolas.html', 'dates': 'Venres 30 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.777912374721796', '42.26610864003268']}, 'properties': {'name': 'Lacón sin Jrelos + Satenta + Youcanthide', 'location': 'Cangas', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31228/-/lacon-sin-jrelos-satenta-youcanthide.html', 'dates': 'Venres 30 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.78903828103731', '42.94967508003372']}, 'properties': {'name': 'MJ Pérez', 'location': 'Paredes de Coura (Portugal)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31292/-/mj-perez.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.6532188195746516', '43.44757854763116']}, 'properties': {'name': 'XVIII Tasca do Liño', 'location': 'A Insua, Vilapedre (Vilalba)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31264/-/xviii-tasca-do-lino.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.851356297069304', '43.45190691333175']}, 'properties': {'name': 'Cantos aos Cogomelos', 'location': 'As Pontes', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31360/-/cantos-aos-cogomelos.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-6.875297847543', '42.8586335444939']}, 'properties': {'name': 'Polavila en Piornedo', 'location': 'Piornedo, Donís (Cervantes)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31317/-/polavila-en-piornedo.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.1571708783053', '43.50082143514774']}, 'properties': {'name': 'Minguante', 'location': 'Neda', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31289/-/minguante.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-3.703074399787207', '40.41808286815194']}, 'properties': {'name': 'Fillas de Cassandra', 'location': 'Madrid (España)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30169/-/fillas-de-cassandra.html', 'dates': 'Venres 06 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.654656957983063', '42.076023328817']}, 'properties': {'name': 'Serán de Rebordáns', 'location': 'Rebordáns (Tui)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31361/-/seran-de-rebordans.html', 'dates': 'Venres 06 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.59027605806101', '42.590452097113484']}, 'properties': {'name': 'XV Serán Magosteiro', 'location': 'Moraña', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31342/-/xv-seran-magosteiro.html', 'dates': 'Sábado 07 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.641418949509616', '42.43343988041805']}, 'properties': {'name': 'Magusto Associativo', 'location': 'Pontevedra', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31359/-/magusto-associativo.html', 'dates': 'Sábado 07 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.646777222160623', '42.43282501087063']}, 'properties': {'name': 'Kortalumes', 'location': 'Coslada, Madrid (España)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31338/-/kortalumes.html', 'dates': 'Sábado 07, Sábado 14 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-5.567833970075272', '42.60019029530911']}, 'properties': {'name': 'Xabier Díaz', 'location': 'León (España)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31301/-/xabier-diaz.html', 'dates': 'Venres 13 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.866366185005271', '42.34430641818392']}, 'properties': {'name': 'Guadi Galego', 'location': 'Ourense', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31283/-/guadi-galego.html', 'dates': 'Venres 13, Sábado 14 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.883882854837248', '42.648254382095885']}, 'properties': {'name': 'Abril + Lontras', 'location': 'Boiro', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31231/-/abril-lontras.html', 'dates': 'Venres 13 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.893921657981832', '43.18158843391331']}, 'properties': {'name': 'Festa e Xantar 50 Anos de Xermolos', 'location': 'Guitiriz', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31357/-/festa-e-xantar-50-anos-de-xermolos.html', 'dates': 'Sábado 14 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.652192371471697', '42.19801242963516']}, 'properties': {'name': 'Unto Vello ', 'location': 'O Rebullón, Tameiga (Mos)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31232/-/unto-vello.html', 'dates': 'Sábado 21 [Novembro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.812122778856534', '42.514485427578606']}, 'properties': {'name': 'Maricarme', 'location': 'Cambados', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31233/-/maricarme.html', 'dates': 'Domingo 22 [Novembro]'}}]},
            cluster: !0,
            clusterMaxZoom: 14,
            clusterRadius: 50
          }), map.addLayer({
            id: "clusters",
            type: "circle",
            source: "folk-events",
            filter: ["has", "point_count"],
            paint: {
              "circle-color": ["step", ["get", "point_count"], "#51bbd6", 10, "#ed9f32", 20, "#f28cb1"],
              "circle-radius": ["step", ["get", "point_count"], 20, 100, 30, 750, 40]
            }
          }), map.addLayer({
            id: "cluster-count",
            type: "symbol",
            source: "folk-events",
            filter: ["has", "point_count"],
            layout: {
              "text-field": "{point_count_abbreviated}",
              // "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Bold"],
              "text-font": ["Open Sans Bold"],
              "text-size": 12,
              "text-allow-overlap": true,
              "text-ignore-placement": true
            }
          }), map.addLayer({
            id: "unclustered-point",
            type: "circle",
            source: "folk-events",
            filter: ["!", ["has", "point_count"]],
            paint: {
              "circle-color": "#11b4da",
              "circle-radius": 7,
              "circle-stroke-width": 2,
              "circle-stroke-color": "#0b5975"
            }
          }), map.on("click", "clusters", async (e) => {
            const features = map.queryRenderedFeatures(e.point, {
              layers: ["clusters"]
            });
            const clusterId = features[0].properties.cluster_id;
            const zoom = await map.getSource("folk-events").getClusterExpansionZoom(clusterId);
            map.easeTo({
              center: features[0].geometry.coordinates,
              zoom: zoom
            });
          }), map.on("click", "unclustered-point", e => {
            const t = e.features[0].geometry.coordinates.slice(),
              name = e.features[0].properties.name,
              location = e.features[0].properties.location,
              link = e.features[0].properties.link,
              dates = e.features[0].properties.dates;
            for (; Math.abs(e.lngLat.lng - t[0]) > 180;) t[0] += e.lngLat.lng > t[0] ? 360 : -360;
            (new maplibregl.Popup).setLngLat(t).setHTML(`
            <h4>${name}</h4><br>
            <i class="fa fa-map-marker" aria-hidden="true"></i> ${location}<br>
            <a href="${link}" target="_blank" rel="noopener"><i class="fa fa-external-link" aria-hidden="true"></i> Detalles</a><br>
            <i class="fa fa-calendar" aria-hidden="true"></i> ${dates}
            `).addTo(map)
          }), map.on("mouseenter", "clusters", () => {
            map.getCanvas().style.cursor = "pointer"
          }), map.on("mouseleave", "clusters", () => {
            map.getCanvas().style.cursor = ""
          }),

          // Filter data by date buttons
          document.getElementsByClassName('filter-today')[button_group].addEventListener('click', function() {
            map.getSource('folk-events').setData({'type': 'FeatureCollection', 'features': []});
          }),
          document.getElementsByClassName('filter-tomorrow')[button_group].addEventListener('click', function() {
            map.getSource('folk-events').setData({'type': 'FeatureCollection', 'features': [{'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.544097945081786', '42.88149467726764']}, 'properties': {'name': 'Banda das Crechas', 'location': 'Santiago de Compostela', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31308/-/banda-das-crechas.html', 'dates': 'Mércores 28 [Outubro]'}}]});
          }),
          document.getElementsByClassName('filter-week')[button_group].addEventListener('click', function() {
            map.getSource('folk-events').setData({'type': 'FeatureCollection', 'features': [{'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.544097945081786', '42.88149467726764']}, 'properties': {'name': 'Banda das Crechas', 'location': 'Santiago de Compostela', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31308/-/banda-das-crechas.html', 'dates': 'Mércores 28 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.82002053034617', '42.60990890070857']}, 'properties': {'name': 'XXI Castañazo Rock', 'location': 'Chantada', 'link': 'https://www.gzmusica.com/axenda/eventdetail/30220/-/xxi-castanazo-rock.html', 'dates': 'Venres 30, Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.407629550675832', '43.07789756356539']}, 'properties': {'name': 'Pakolas', 'location': 'Ordes', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31298/-/pakolas.html', 'dates': 'Venres 30 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.777912374721796', '42.26610864003268']}, 'properties': {'name': 'Lacón sin Jrelos + Satenta + Youcanthide', 'location': 'Cangas', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31228/-/lacon-sin-jrelos-satenta-youcanthide.html', 'dates': 'Venres 30 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.78903828103731', '42.94967508003372']}, 'properties': {'name': 'MJ Pérez', 'location': 'Paredes de Coura (Portugal)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31292/-/mj-perez.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.6532188195746516', '43.44757854763116']}, 'properties': {'name': 'XVIII Tasca do Liño', 'location': 'A Insua, Vilapedre (Vilalba)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31264/-/xviii-tasca-do-lino.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-7.851356297069304', '43.45190691333175']}, 'properties': {'name': 'Cantos aos Cogomelos', 'location': 'As Pontes', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31360/-/cantos-aos-cogomelos.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-6.875297847543', '42.8586335444939']}, 'properties': {'name': 'Polavila en Piornedo', 'location': 'Piornedo, Donís (Cervantes)', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31317/-/polavila-en-piornedo.html', 'dates': 'Sábado 31 [Outubro]'}}, {'type': 'Feature', 'geometry': {'type': 'Point', 'coordinates': ['-8.1571708783053', '43.50082143514774']}, 'properties': {'name': 'Minguante', 'location': 'Neda', 'link': 'https://www.gzmusica.com/axenda/eventdetail/31289/-/minguante.html', 'dates': 'Sábado 31 [Outubro]'}}]});
          }),
